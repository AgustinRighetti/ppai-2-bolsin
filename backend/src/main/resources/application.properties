server.port=8080

# Base de datos H2 persistida en archivo (./data/bolsines.mv.db)
spring.datasource.url=jdbc:h2:file:./data/bolsines;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola para mostrar la persistencia en la defensa: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
